name: 🧪 Tests

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

permissions:
    contents: read

jobs:
    test-package-tests:
        name: Test Package Tests
        uses: ./.github/workflows/package-tests.yml
        with:
            dotnet-project: sandbox/ConsoleApplication
            global-json-file: sandbox/ConsoleApplication/global.json

    test-godot-tests:
        name: Test Godot Project Tests
        uses: ./.github/workflows/project-tests.yml
        with:
            godot-project: sandbox/GodotApplication
            global-json-file: sandbox/GodotApplication/global.json

    test-package-format:
        name: Test Package Format
        uses: ./.github/workflows/package-format.yml
        with:
            dotnet-project: sandbox/ConsoleApplication
            global-json-file: sandbox/ConsoleApplication/global.json

    test-project-format:
        name: Test Project Format
        uses: ./.github/workflows/project-format.yml
        with:
            dotnet-project: sandbox/ConsoleApplication
            global-json-file: sandbox/ConsoleApplication/global.json

    test-package-release:
        name: Test Package Release
        uses: ./.github/workflows/package-release.yml
        with:
            package-name: Test Package
            version-type: auto
            version-suffix: dev
            dotnet-project: sandbox/ConsoleApplication
            godot-addon: sandbox/GodotApplication/addons/TestAddon
            unity-package: sandbox/UnityApplication/Packages/com.test.package
            global-json-file: sandbox/ConsoleApplication/global.json
            create-tag: false
            publish-github: false
            publish-nuget: false
            publish-github-packages: false
            publish-discord: false
        secrets:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            client-id: ${{ secrets.CLIENT_ID }}
            app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

    test-package-release-unchanged:
        name: Test Package Release Unchanged
        uses: ./.github/workflows/package-release.yml
        with:
            package-name: Test Package
            version-type: patch
            dotnet-project: sandbox/ConsoleApplication
            global-json-file: sandbox/ConsoleApplication/global.json
            create-tag: false
            publish-github: false
            publish-nuget: false
            publish-github-packages: false
            publish-discord: false
            skip-unchanged: true
        secrets:
            github-token: ${{ secrets.GITHUB_TOKEN }}

    check-package-release-unchanged:
        name: Check Package Release Unchanged
        needs: test-package-release-unchanged
        runs-on: ubuntu-latest
        steps:
            - name: ✅ Check Skipped Release
              shell: bash
              env:
                  HAS_CHANGES: ${{ needs.test-package-release-unchanged.outputs.has-changes }}
              run: |
                  if [ "${HAS_CHANGES}" != "false" ]; then
                      echo "::error::Expected a skipped release because this repository has no src folder, got has-changes=${HAS_CHANGES}"
                      exit 1
                  fi

    test-project-release:
        name: Test Project Release
        uses: ./.github/workflows/project-release.yml
        with:
            project-name: Test Project
            version-type: auto
            version-suffix: dev
            godot-project: sandbox/GodotApplication
            unity-project: sandbox/UnityApplication
            global-json-file: sandbox/GodotApplication/global.json
            create-tag: false
            build-android: false
            build-ios: false
            publish-github: false
            publish-firebase: false
            publish-testflight: false
            publish-discord: false
        secrets:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            client-id: ${{ secrets.CLIENT_ID }}
            app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
