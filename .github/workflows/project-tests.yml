name: 🧪 Test Project

on:
    workflow_call:
        inputs:
            runs-on:
                description: The type of runner to use (ubuntu-latest, macos-latest, or self-hosted label)
                required: false
                type: string
                default: "ubuntu-latest"
            dotnet-project:
                description: Path to the .NET test project containing the .csproj file such as "tests/Game.Tests"
                required: false
                type: string
                default: ""
            global-json-file:
                description: The relative path to the global.json file to extract .NET and Godot version
                required: false
                type: string
                default: ""
            godot-project:
                description: Path to the Godot project containing the project.godot file such as "projects/Game"
                required: false
                type: string
                default: ""
            unity-project:
                description: Path to the Unity project containing the ProjectSettings folder such as "projects/UnityGame"
                required: false
                type: string
                default: ""
            unity-path:
                description: Custom directory for Unity installations (default /Applications/Unity on macOS, $HOME on Linux)
                required: false
                type: string
                default: ""
            unity-test-modes:
                description: Comma-separated list of Unity test platforms to run. Supported values are EditMode and PlayMode.
                required: false
                type: string
                default: "EditMode,PlayMode"
            unity-graphics:
                description: Set to true when the runner has a graphics device, so that Unity tests in the Graphics category run
                required: false
                type: boolean
                default: false
            unity-test-retries:
                description: Number of times to run a Unity test mode again when tests in it fail
                required: false
                type: number
                default: 0
            unity-test-timeout:
                description: Maximum number of seconds each Unity test run may take
                required: false
                type: number
                default: 3600
        secrets:
            unity-email:
                description: The Unity account email address
                required: false
            unity-password:
                description: The Unity account password
                required: false
            unity-license-key:
                description: The Unity license serial key, returned when the tests end
                required: false
            client-id:
                description: GitHub App client ID for generating a token that reads the owner's private Git packages
                required: false
            app-private-key:
                description: GitHub App private key for generating a token that reads the owner's private Git packages
                required: false

env:
    GITHUB_TOKEN: ${{ github.token }}

jobs:
    test-dotnet:
        name: Test .NET
        if: inputs.dotnet-project != ''
        runs-on: ${{ inputs.runs-on }}

        steps:
            - name: 📂 Checkout Code
              uses: actions/checkout@v7
              with:
                  lfs: false

            - name: 🔑 Hash Git LFS Files
              id: lfs-files
              shell: bash
              run: echo "hash=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | git hash-object --stdin)" >> "${GITHUB_OUTPUT}"

            - name: 💾 Cache Git LFS Files
              if: runner.environment == 'github-hosted'
              uses: actions/cache@v6
              with:
                  path: .git/lfs
                  key: lfs-${{ runner.os }}-${{ steps.lfs-files.outputs.hash }}
                  restore-keys: lfs-${{ runner.os }}-

            - name: 📦 Pull Git LFS Files
              shell: bash
              run: |
                  git lfs install --local
                  git lfs pull

            - name: 🔧 Setup .NET
              uses: grovegs/actions/.github/actions/setup-dotnet@v1.12.1
              with:
                  global-json-file: ${{ inputs.global-json-file }}

            - name: 🧪 Test .NET Project
              uses: grovegs/actions/.github/actions/test-dotnet@v1.12.1
              with:
                  project: ${{ inputs.dotnet-project }}
                  configuration: Release

    test-godot:
        name: Test Godot
        if: inputs.godot-project != ''
        runs-on: ${{ inputs.runs-on }}

        steps:
            - name: 📂 Checkout Code
              uses: actions/checkout@v7
              with:
                  lfs: false

            - name: 🔑 Hash Git LFS Files
              id: lfs-files
              shell: bash
              run: echo "hash=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | git hash-object --stdin)" >> "${GITHUB_OUTPUT}"

            - name: 💾 Cache Git LFS Files
              if: runner.environment == 'github-hosted'
              uses: actions/cache@v6
              with:
                  path: .git/lfs
                  key: lfs-${{ runner.os }}-${{ steps.lfs-files.outputs.hash }}
                  restore-keys: lfs-${{ runner.os }}-

            - name: 📦 Pull Git LFS Files
              shell: bash
              run: |
                  git lfs install --local
                  git lfs pull

            - name: 🔧 Setup .NET
              uses: grovegs/actions/.github/actions/setup-dotnet@v1.12.1
              with:
                  global-json-file: ${{ inputs.global-json-file }}

            - name: 🎮 Setup Godot
              uses: grovegs/actions/.github/actions/setup-godot@v1.12.1
              with:
                  global-json-file: ${{ inputs.global-json-file }}

            - name: 🧪 Test Godot Project
              uses: grovegs/actions/.github/actions/test-godot@v1.12.1
              with:
                  project: ${{ inputs.godot-project }}

    test-unity:
        name: Test Unity
        if: inputs.unity-project != ''
        runs-on: ${{ inputs.runs-on }}

        steps:
            - name: 📂 Checkout Code
              uses: actions/checkout@v7
              with:
                  lfs: false

            - name: 🔑 Hash Git LFS Files
              id: lfs-files
              shell: bash
              run: echo "hash=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | git hash-object --stdin)" >> "${GITHUB_OUTPUT}"

            - name: 💾 Cache Git LFS Files
              if: runner.environment == 'github-hosted'
              uses: actions/cache@v6
              with:
                  path: .git/lfs
                  key: lfs-${{ runner.os }}-${{ steps.lfs-files.outputs.hash }}
                  restore-keys: lfs-${{ runner.os }}-

            - name: 📦 Pull Git LFS Files
              shell: bash
              run: |
                  git lfs install --local
                  git lfs pull

            - name: 🔑 Generate Package Token
              id: package-token
              uses: actions/create-github-app-token@v3
              continue-on-error: true
              with:
                  client-id: ${{ secrets.client-id }}
                  private-key: ${{ secrets.app-private-key }}
                  owner: ${{ github.repository_owner }}
                  permission-contents: read

            - name: 🔐 Authorize Private Git Packages
              if: steps.package-token.outputs.token != ''
              shell: bash
              env:
                  PACKAGE_TOKEN: ${{ steps.package-token.outputs.token }}
              run: |
                  {
                      echo "GIT_CONFIG_COUNT=1"
                      echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${PACKAGE_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/.insteadOf"
                      echo "GIT_CONFIG_VALUE_0=https://github.com/${GITHUB_REPOSITORY_OWNER}/"
                  } >> "${GITHUB_ENV}"

            - name: 🎮 Setup Unity
              uses: grovegs/actions/.github/actions/setup-unity@v1.12.1
              with:
                  project: ${{ inputs.unity-project }}
                  unity-path: ${{ inputs.unity-path }}

            - name: 🧪 Test Unity Project
              uses: grovegs/actions/.github/actions/test-unity@v1.12.1
              with:
                  project: ${{ inputs.unity-project }}
                  unity-path: ${{ inputs.unity-path }}
                  test-modes: ${{ inputs.unity-test-modes }}
                  graphics: ${{ inputs.unity-graphics }}
                  retries: ${{ inputs.unity-test-retries }}
                  timeout: ${{ inputs.unity-test-timeout }}
                  unity-email: ${{ secrets.unity-email }}
                  unity-password: ${{ secrets.unity-password }}
                  unity-license-key: ${{ secrets.unity-license-key }}
