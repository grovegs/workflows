name: 🧪 Test Project

on:
    workflow_call:
        inputs:
            runs-on:
                description: The type of runner to use (ubuntu-latest, macos-latest, or self-hosted label)
                required: false
                type: string
                default: "ubuntu-latest"
            dotnet-project:
                description: Path to the .NET test project containing the .csproj file such as "tests/Game.Tests"
                required: false
                type: string
                default: ""
            global-json-file:
                description: The relative path to the global.json file to extract .NET and Godot version
                required: false
                type: string
                default: ""
            godot-project:
                description: Path to the Godot project containing the project.godot file such as "projects/Game"
                required: false
                type: string
                default: ""
            unity-project:
                description: Path to the Unity project containing the ProjectSettings folder such as "projects/UnityGame"
                required: false
                type: string
                default: ""

env:
    GITHUB_TOKEN: ${{ github.token }}

jobs:
    test-dotnet:
        name: Test .NET
        if: inputs.dotnet-project != ''
        runs-on: ${{ inputs.runs-on }}

        steps:
            - name: 📂 Checkout Code
              uses: actions/checkout@v7
              with:
                  lfs: false

            - name: 🔑 Hash Git LFS Files
              id: lfs-files
              shell: bash
              run: echo "hash=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | git hash-object --stdin)" >> "${GITHUB_OUTPUT}"

            - name: 💾 Cache Git LFS Files
              if: runner.environment == 'github-hosted'
              uses: actions/cache@v6
              with:
                  path: .git/lfs
                  key: lfs-${{ runner.os }}-${{ steps.lfs-files.outputs.hash }}
                  restore-keys: lfs-${{ runner.os }}-

            - name: 📦 Pull Git LFS Files
              shell: bash
              run: |
                  git lfs install --local
                  git lfs pull

            - name: 🔧 Setup .NET
              uses: grovegs/actions/.github/actions/setup-dotnet@v1.4.4
              with:
                  global-json-file: ${{ inputs.global-json-file }}

            - name: 🧪 Test .NET Project
              uses: grovegs/actions/.github/actions/test-dotnet@v1.4.4
              with:
                  project: ${{ inputs.dotnet-project }}
                  configuration: Release

    test-godot:
        name: Test Godot
        if: inputs.godot-project != ''
        runs-on: ${{ inputs.runs-on }}

        steps:
            - name: 📂 Checkout Code
              uses: actions/checkout@v7
              with:
                  lfs: false

            - name: 🔑 Hash Git LFS Files
              id: lfs-files
              shell: bash
              run: echo "hash=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | git hash-object --stdin)" >> "${GITHUB_OUTPUT}"

            - name: 💾 Cache Git LFS Files
              if: runner.environment == 'github-hosted'
              uses: actions/cache@v6
              with:
                  path: .git/lfs
                  key: lfs-${{ runner.os }}-${{ steps.lfs-files.outputs.hash }}
                  restore-keys: lfs-${{ runner.os }}-

            - name: 📦 Pull Git LFS Files
              shell: bash
              run: |
                  git lfs install --local
                  git lfs pull

            - name: 🔧 Setup .NET
              uses: grovegs/actions/.github/actions/setup-dotnet@v1.4.4
              with:
                  global-json-file: ${{ inputs.global-json-file }}

            - name: 🎮 Setup Godot
              uses: grovegs/actions/.github/actions/setup-godot@v1.4.4
              with:
                  global-json-file: ${{ inputs.global-json-file }}

            - name: 🧪 Test Godot Project
              uses: grovegs/actions/.github/actions/test-godot@v1.4.4
              with:
                  project: ${{ inputs.godot-project }}

    test-unity:
        name: Test Unity
        if: inputs.unity-project != ''
        runs-on: ${{ inputs.runs-on }}

        steps:
            - name: 📂 Checkout Code
              uses: actions/checkout@v7
              with:
                  lfs: false

            - name: 🔑 Hash Git LFS Files
              id: lfs-files
              shell: bash
              run: echo "hash=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | git hash-object --stdin)" >> "${GITHUB_OUTPUT}"

            - name: 💾 Cache Git LFS Files
              if: runner.environment == 'github-hosted'
              uses: actions/cache@v6
              with:
                  path: .git/lfs
                  key: lfs-${{ runner.os }}-${{ steps.lfs-files.outputs.hash }}
                  restore-keys: lfs-${{ runner.os }}-

            - name: 📦 Pull Git LFS Files
              shell: bash
              run: |
                  git lfs install --local
                  git lfs pull

            - name: 🎮 Setup Unity
              uses: grovegs/actions/.github/actions/setup-unity@v1.4.4
              with:
                  project: ${{ inputs.unity-project }}

            - name: 🧪 Test Unity Project
              uses: grovegs/actions/.github/actions/test-unity@v1.4.4
              with:
                  project: ${{ inputs.unity-project }}
