name: 🚀 Release

on:
    workflow_dispatch:
        inputs:
            version-type:
                description: Select the version to increment such as major, minor, or patch
                required: true
                default: patch
                type: choice
                options:
                    - major
                    - minor
                    - patch

permissions:
    contents: write

jobs:
    prepare:
        name: Prepare Release
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.bump-version.outputs.next-version }}
            changelog-raw: ${{ steps.generate-changelog.outputs.changelog-raw }}
            changelog-plain: ${{ steps.generate-changelog.outputs.changelog-plain }}
            changelog-markdown: ${{ steps.generate-changelog.outputs.changelog-markdown }}

        steps:
            - name: 📂 Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: 📝 Generate Changelog
              id: generate-changelog
              uses: grovegs/actions/.github/actions/generate-changelog@v1.2.0

            - name: 🆙 Bump Version
              id: bump-version
              uses: grovegs/actions/.github/actions/bump-version@v1.2.0
              with:
                  version-type: ${{ inputs.version-type }}

    release:
        name: Publish Release
        needs: prepare
        runs-on: ubuntu-latest

        steps:
            - name: 📂 Checkout Code
              uses: actions/checkout@v6

            - name: 🚀 Publish to GitHub
              uses: grovegs/actions/.github/actions/publish-github@v1.2.0
              with:
                  title: Release v${{ needs.prepare.outputs.version }}
                  version: v${{ needs.prepare.outputs.version }}
                  changelog: ${{ needs.prepare.outputs.changelog-markdown }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: 📢 Notify Discord Success
              if: success()
              continue-on-error: true
              uses: grovegs/actions/.github/actions/notify-discord@v1.2.0
              with:
                  webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
                  title: ✅ ${{ github.event.repository.name }} v${{ needs.prepare.outputs.version }} (${{ github.ref_name }})
                  description: |
                      ${{ needs.prepare.outputs.changelog-markdown }}

                      [View Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.prepare.outputs.version }})
                  color: "3066993"

            - name: 📢 Notify Discord Failure
              if: failure()
              continue-on-error: true
              uses: grovegs/actions/.github/actions/notify-discord@v1.2.0
              with:
                  webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
                  title: ❌ ${{ github.event.repository.name }} v${{ needs.prepare.outputs.version }} (${{ github.ref_name }})
                  description: |
                      Release publication failed.

                      [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
                  color: "15158332"

    cleanup:
        name: Cleanup on Failure
        if: always() && (failure() || cancelled()) && needs.prepare.result == 'success'
        needs: [prepare, release]
        runs-on: ubuntu-latest

        steps:
            - name: 📂 Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: 🗑️ Delete Tag
              run: |
                  git push origin :refs/tags/v${{ needs.prepare.outputs.version }}
