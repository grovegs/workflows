name: 🧹 Prune Branches

on:
    workflow_call:
        inputs:
            runs-on:
                description: The type of runner to use (ubuntu-latest, macos-latest, or self-hosted label)
                required: false
                type: string
                default: "ubuntu-latest"
            exclude-branches:
                description: Newline-separated branch name patterns to keep, such as main or release/*
                required: false
                type: string
                default: |
                    main
                    develop
            stale-days:
                description: Delete branches without a merged pull request whose last commit is at least this many days old. Use 0 to only delete merged branches
                required: false
                type: number
                default: 0
            dry-run:
                description: List the branches that would be deleted without deleting them
                required: false
                type: boolean
                default: false
        outputs:
            deleted-branches:
                description: Newline-separated names of the deleted branches, or the branches that would be deleted in a dry run
                value: ${{ jobs.prune-branches.outputs.deleted-branches }}

jobs:
    prune-branches:
        name: Prune Branches
        runs-on: ${{ inputs.runs-on }}
        permissions:
            contents: write
            pull-requests: read
        outputs:
            deleted-branches: ${{ steps.prune-branches.outputs.deleted-branches }}

        steps:
            - name: 🧹 Prune Branches
              id: prune-branches
              uses: grovegs/actions/.github/actions/prune-branches@v1.8.0
              with:
                  exclude-branches: ${{ inputs.exclude-branches }}
                  stale-days: ${{ inputs.stale-days }}
                  dry-run: ${{ inputs.dry-run }}
